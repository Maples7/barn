  - company_name: 心知天气
    job_position: 后端研发负责人
    from: 2017.6
    to: 2020.6
    content: 与 CTO 一起对整个后端天气数据处理流程——从数据采集到数据分发——进行完整的架构设计和实现：<b>数据处理</b>部分主要涉及对数据处理任务流的管理以及不同数据类型的存储方案，是关于如何快速高效地处理和存储数据的问题；<b>数据分发</b>部分主要是构建能承载高并发请求的稳定的 API 系统，包括从 SLB 到微服务的全请求链路的设计优化，同时还有一套官网自助下单开通服务的系统。
    list:
      API v4 - Hogwarts:
        link: https://api.seniverse.com/v4
        content: 全新的 API 架构体系，主要为了解决 v3 API 在用户体验和并发性能上的问题。底层服务用 Elixir 进行完全的重新设计与实现，将网关逻辑和无状态的数据服务剥离开来。在<b>用户使用方式上</b>，自主实现了 Google+ 的 Partial Response 协议使得 API 支持用户自定义任意字段的组合拼装返回；在<b>接口性能上</b>，内部服务之间完全使用 Erlang 原生的 RPC 协议进行 I/O 通信；同时重新设计了<b>数据存储方式</b>，底层存储依赖 OSS，把气象数据通过标准的二进制矩阵排列归一化处理，再使用多级缓存提升访问性能；在<b>服务稳定性上</b>，完全用 Cloud Native 的理念设计开发，整个系统部署在阿里云的 Kubernetes 集群上，并实现了自动伸缩；在<b>开发效率上</b>，尽可能从「元编程」和「元流程」的更高层角度思考数据在整个系统中的流动过程，尽可能的设计统一的规范和标准作为底层支持来满足上层的数据流转需求，让研发人员通常是在研发平台和规则，而具体的单一数据开发和迭代的需求则可以通过简单的配置来快速验证上线。个人主要负责大部分系统架构的设计、标准和规范的制定，和组内成员一起完成了开发上线工作，并持续迭代维护。
      官网 v3 - Hansel:
        link: https://seniverse.com/
        content: 主要是基于 NestJS 框架，使用 TypeScript 设计和实现了同时支持前台和后台的官网后端服务。功能上支持用户在官网自主下单、支付、开通 API 服务的全流程，模块主要可以划分为组织、用户、订单、交易、产品定义、产品实例等。个人负责了从前期技术选型开始的服务构建和代码组织、大部分模块的实现以及最后的服务正式上线工作。
      数据采集系统 - Scorpio:
        link: https://www.processon.com/view/link/599cf06be4b0abd6112d9f68
        content: 对于天气站点数据，在 Python3 体系下用 Celery/RabbitMQ 任务队列实现了分布式抓取、前期筛选处理、不同数据源的数据融合、后期处理标准化、存储入库的过程。其间使用 Statsd/Graphite 来监控任务处理状态和系统关键指标。最后用 Twitter 的 PEX 工具对程序进行打包部署。个人负责了该系统全部的设计和实现。对于专业格点数据，使用 Airflow 来管理 ETL 任务流，个人负责了大部分数据流程的实现和维护。
      基于 Kong 网关的微服务架构设计与实现 - Halo:
        content: 基于开源的网关系统 Kong/OpenResty，用 Lua 二次定制开发了与业务相契合的网关服务，目的是拆分用户逻辑和无状态的数据接口逻辑，使得系统更易维护且易于扩展。功能上主要包括对请求参数的校验、用户鉴权、与用户相关请求的日志采集、访问量统计与扣减、访问频率限制等。其中包括一个简单的时间序列数据库的实现用于访问量的不同时间纬度的图表展示。最终服务部署在 Kubernetes 集群。个人负责了大部分 Plugin 的开发维护和迭代部署上线的工作。
